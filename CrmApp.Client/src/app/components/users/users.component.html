<crm-header [headerSubpageTitle]="'Użytkownicy'"></crm-header>
<div class="page h-100">
        <div class="content w-100">
            <div class="col-11 d-flex justify-content-between align-items-center">
                <div class="col-8 d-flex justify-content-start align-items-center px-2 mt-4">
                    <button mat-flat-button color="default" class="pill create" (click)="addUser()"
                        [hidden]="!canUsersCreate">
                        <mat-icon svgIcon="add"></mat-icon> Utwórz nowy
                    </button>
                </div>
                <div class="col-4 d-flex justify-content-end align-items-center px-2 mt-4">
                    <mat-form-field class="w-100 ellipsis-input" appearance="outline" floatLabel="always">
                        <mat-label>Filtruj</mat-label>
                        <mat-icon matPrefix>search</mat-icon>
                        <input matInput [(ngModel)]="filterValue" (keyup)="applyFilter($event)" placeholder="..."
                            #input>
                        <button *ngIf="filterValue && filterValue.length" mat-icon-button matSuffix aria-label="Wyczyść"
                            (click)="resetFilter()" class="mat-icon-button-small mr-1">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>
                </div>
            </div>
            <div class="col-11 d-flex justify-content-center align-items-start p-2 flex-wrap">
                <table mat-table [dataSource]="dataSource" class="crm-table" matSort>
                    <ng-container matColumnDef="firstName">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Imię </th>
                        <td mat-cell *matCellDef="let element"> {{element.firstName}} </td>
                    </ng-container>
                    <ng-container matColumnDef="lastName">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nazwisko </th>
                        <td mat-cell *matCellDef="let element"> {{element.lastName}} </td>
                    </ng-container>
                    <ng-container matColumnDef="displayName">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nazwa wyświetlana </th>
                        <td mat-cell *matCellDef="let element"> {{element.displayName}} </td>
                    </ng-container>
                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> E-mail </th>
                        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
                    </ng-container>
                    <ng-container matColumnDef="isDeleted">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header> Konto aktywne? </th>
                        <td mat-cell *matCellDef="let element"> 
                            <mat-icon *ngIf="element.isDeleted" svgIcon="error" class="mx-4 danger"></mat-icon>
                            <mat-icon *ngIf="!element.isDeleted" svgIcon="success" class="mx-4 success"></mat-icon>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef>  </th>
                        <td mat-cell *matCellDef="let element"> 
                            <div class="d-flex justify-content-end align-items-center">
                                <button  *ngIf="!element.isDeleted" matIconButton color="danger" class="d-flex mat-icon-button-medium"
                                    [hidden]="!canIdentityManage" matTooltip="Dezaktywuj użytkownika" (click)="deactivateUser(element)">
                                    <mat-icon svgIcon="account_off" class="danger"></mat-icon>
                                </button>
                                <button  *ngIf="element.isDeleted" matIconButton color="danger" class="d-flex mat-icon-button-medium"
                                    [hidden]="!canIdentityManage" matTooltip="Aktywuj użytkownika" (click)="activateUser(element)">
                                    <mat-icon svgIcon="account_active" class="success"></mat-icon>
                                </button>
                                <button matIconButton color="default" class="d-flex mat-icon-button-medium" (click)="editUser(element)"
                                    [hidden]="!canUsersUpdate" matTooltip="Edytuj użytkownika">
                                    <mat-icon svgIcon="edit"></mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell" colspan="5">
                            <h5 class="info-text p-4" *ngIf="users && users.length !== 0 && filterValue">
                                Brak danych spełniających warunki filtra
                            </h5>
                            <h5 class="info-text p-4" *ngIf="!users || users.length === 0">
                                Dodaj użytkownika
                            </h5>
                        </td>
                    </tr>
                </table>
                <div class="col-10 p-0 d-flex justify-content-end align-items-center mt-1">
                    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" [showFirstLastButtons]="true" [pageSize]="10">
                    </mat-paginator>
                </div>
            </div>
        </div>
</div>
