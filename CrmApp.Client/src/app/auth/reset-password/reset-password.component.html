<div class="auth-shell">
    <div class="brand">
        <button class="no-shadow mx-2" matFab>
            <mat-icon svgIcon="network_intel_node"></mat-icon>
        </button>
        <h1 class="brand-title">CrmApp</h1>
    </div>
    <mat-card class="reset-password-card" appearance="outlined">
        <h2 class="card-title">Ustaw nowe hasło</h2>
        <form class="reset-password-form" [formGroup]="form" (ngSubmit)="submit()">
            <mat-form-field class="ellipsis-input" appearance="outline">
                <mat-label>Nowe hasło</mat-label>
                <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" required
                    autocomplete="new-password">
                <button mat-icon-button class="mat-icon-button-small mr-1" type="button" matSuffix (click)="hide = !hide"
                    [attr.aria-label]="hide ? 'Pokaż hasło' : 'Ukryj hasło'">
                    <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="password?.hasError('required')">Hasło jest wymagane</mat-error>
                <mat-error *ngIf="password?.hasError('minlength')">Min. 8 znaków</mat-error>
            </mat-form-field>
            <mat-form-field class="ellipsis-input" appearance="outline">
                <mat-label>Potwierdź hasło</mat-label>
                <input matInput [type]="hide ? 'password' : 'text'" formControlName="confirm" required
                    autocomplete="new-password">
                <button mat-icon-button class="mat-icon-button-small mr-1" type="button" matSuffix (click)="hide = !hide"
                    [attr.aria-label]="hide ? 'Pokaż hasło' : 'Ukryj hasło'">
                    <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="form.hasError('mismatch')">Hasła są różne</mat-error>
            </mat-form-field>
            <button class="reset-password-btn" mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Zapisz</button>
        </form>

        <p *ngIf="done" class="mt-2">Zmieniono hasło. Przekierowanie do logowania…</p>
    </mat-card>
</div>
