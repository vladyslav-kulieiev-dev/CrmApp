<div class="auth-shell">
    <div class="brand">
        <button class="no-shadow mx-2" matFab>
            <mat-icon svgIcon="network_intel_node"></mat-icon>
        </button>
        <h1 class="brand-title">CrmApp</h1>
        <!-- <p class="brand-tagline">Your AI-powered knowledge companion</p> -->
    </div>
    <mat-card class="forgot-password-card" appearance="outlined">
        <h2 class="card-title">Resetowanie hasła</h2>
        <p class="card-subtitle">Podaj adres e-mail. Jeśli konto istnieje, wyślemy link do ustawienia hasła.</p>
        <form class="forgot-password-form" [formGroup]="form" (ngSubmit)="submit()">
            <mat-form-field class="ellipsis-input" appearance="outline">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email" required autocomplete="email">
                <mat-error *ngIf="email?.hasError('required')">Email jest wymagany</mat-error>
                <mat-error *ngIf="email?.hasError('email')">Podaj poprawny email</mat-error>
            </mat-form-field>
            <button class="forgot-password-btn" mat-flat-button color="primary" type="submit" [disabled]="sending || form.invalid">
                Wyślij link
            </button>
        </form>
        <p *ngIf="success" class="mt-2">
            Jeśli konto istnieje, na Twoją skrzynkę pocztową powinna przyjść wiadomość z linkiem do ustawienia nowego
            hasła.
            Sprawdź folder spam.
        </p>
    </mat-card>
</div>
